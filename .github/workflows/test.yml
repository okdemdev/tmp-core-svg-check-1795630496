name: CoreSVG iOS version test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            xcode: /Applications/Xcode_15.4.app
            ios: "17.5"
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app
            ios: "18.5"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Environment
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build SVG variants
        run: |
          python3 sanitize.py fillopacity item-angel-sticker.svg fixed-fillopacity.svg
          python3 sanitize.py baked item-angel-sticker.svg fixed-baked.svg
          cat > control.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <path d="M10 10h80v80H10z" fill="#FF0000" opacity="0.5"/>
          </svg>
          SVG

      - name: Create and boot simulator
        id: sim
        run: python3 ci.py create "${{ matrix.ios }}"

      - name: Compile harness
        run: |
          ARCH=$(uname -m)
          xcrun --sdk iphonesimulator swiftc \
            -target "${ARCH}-apple-ios${{ matrix.ios }}-simulator" \
            svgtest3.swift -o svgtest3 -framework UIKit

      - name: Run tests
        run: |
          python3 ci.py run "${{ steps.sim.outputs.device }}" \
            item-angel-sticker.svg \
            fixed-fillopacity.svg \
            fixed-baked.svg \
            control.svg
