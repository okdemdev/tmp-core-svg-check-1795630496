name: CoreSVG iOS version test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            xcode: /Applications/Xcode_15.4.app
            ios: "17.5"
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app
            ios: "18.5"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Environment
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Create and boot simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
import json,sys
d=json.load(sys.stdin)
want='${{ matrix.ios }}'
matches=[r for r in d['runtimes'] if r.get('version','').startswith(want)]
if not matches:
    raise SystemExit('no runtime '+want)
print(matches[0]['identifier'])
")
          echo "runtime=$RUNTIME"
          DEVICE=$(xcrun simctl create "CoreSVGTest" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Compile harness
        run: |
          ARCH=$(uname -m)
          xcrun --sdk iphonesimulator swiftc \
            -target "${ARCH}-apple-ios${{ matrix.ios }}-simulator" \
            svgtest2.swift -o svgtest2 -framework UIKit

      - name: Run tests
        run: |
          sed 's/ opacity="/ fill-opacity="/g' item-angel-sticker.svg > fixed.svg
          cat > control.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <path d="M10 10h80v80H10z" fill="#FF0000" opacity="0.5"/>
          </svg>
          EOF
          set +e
          for f in item-angel-sticker.svg fixed.svg control.svg; do
            echo "===== $f ====="
            xcrun simctl spawn "${{ steps.sim.outputs.device }}" "$PWD/svgtest2" "$PWD/$f"
            echo "EXIT_$f=$?"
          done
